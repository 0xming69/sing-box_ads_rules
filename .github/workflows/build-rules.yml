name: Build and Release Sing-box Rules

on:
  schedule:
    # 每天 UTC 时间 20:00（即北京时间次日凌晨 04:00）全自动更新
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动测试执行
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-rules.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          echo "Fetching latest sing-box release..."
          TAG=$(curl -sSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION=${TAG#v}
          echo "Latest sing-box version: $VERSION"
          curl -sSL -O "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -zxvf "sing-box-${VERSION}-linux-amd64.tar.gz"
          sudo cp "sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/
          sing-box version

      - name: Download All Filter Lists
        run: |
          mkdir -p rules_raw rules_build dist

          echo "Downloading filter lists in parallel..."
          curl -sSL "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt" -o rules_raw/filter_1.txt &
          curl -sSL "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt" -o rules_raw/filter_2.txt &
          curl -sSL "https://raw.githubusercontent.com/BlueSkyXN/AdGuardHomeRules/master/all.txt" -o rules_raw/bluesky_all.txt &
          curl -sSL "https://raw.githubusercontent.com/hululu1068/AdGuard-Rule/main/rule/adgh.txt" -o rules_raw/hululu_adgh.txt &
          curl -sSL "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-easylist.txt" -o rules_raw/anti_ad.txt &
          curl -sSL "https://raw.githubusercontent.com/xndeye/adblock_list/refs/heads/release/dns.txt" -o rules_raw/xndeye_dns.txt &
          curl -sSL "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdnslite.txt" -o rules_raw/heidai_lite.txt &
          curl -sSL "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt" -o rules_raw/awavenue.txt &
          curl -sSL "https://raw.githubusercontent.com/BlueSkyXN/AdGuardHomeRules/master/skyrules.txt" -o rules_raw/bluesky_sky.txt &
          wait
          echo "All source files downloaded successfully."

      - name: Clean Rules and Build JSON Rule-Set
        run: |
          echo "Extracting pure domain suffixes..."

          # 1. 提取所有 ||domain^ 中的纯域名
          grep -h -E '^\|\|[a-zA-Z0-9][-a-zA-Z0-9.]*\.[a-zA-Z]{2,}\^$' rules_raw/*.txt | \
            sed -E 's/^\|\|(.*)\^$/\1/' > rules_build/raw_domains.txt || true

          # 2. 提取标准 Hosts 格式中的纯域名
          grep -h -E '^(127\.0\.0\.1|0\.0\.0\.0)[[:space:]]+[a-zA-Z0-9][-a-zA-Z0-9.]*\.[a-zA-Z]{2,}' rules_raw/*.txt | \
            awk '{print $2}' >> rules_build/raw_domains.txt || true

          # 3. 严格清洗：去重、过滤本地回环、小写化
          cat rules_build/raw_domains.txt | \
            tr '[:upper:]' '[:lower:]' | \
            grep -vE '^(localhost|broadcasthost|local|lan|internal)$' | \
            sort -u > rules_build/domains.txt

          echo "Total unique domain count: $(wc -l < rules_build/domains.txt)"

          # 4. 生成 sing-box 标准 JSON 规则集
          python3 -c '
          import json

          with open("rules_build/domains.txt", "r") as f:
              domains = [line.strip() for line in f if line.strip()]

          rule_set = {
              "version": 2,
              "rules": [
                  {
                      "domain_suffix": domains
                  }
              ]
          }

          with open("rules_build/adguard-dns.json", "w") as f:
              json.dump(rule_set, f)
          '
          ls -lh rules_build/adguard-dns.json

      - name: Compile to Sing-box Binary Rule-set
        run: |
          echo "Compiling JSON rule-set to binary SRS..."
          sing-box rule-set compile rules_build/adguard-dns.json -o dist/adguard-dns.srs
          ls -lh dist/adguard-dns.srs

      - name: Deploy to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: release
          keep_files: false
          commit_message: "Automated update sing-box adblock rules: ${{ github.sha }}"
